<script>
(function () {
    const DESKTOP_PAGE = "book-list.html";
    const MOBILE_PAGE  = "book-list-mobile.html";
    const BREAKPOINT   = 768;

    function isPortrait() {
        return window.matchMedia("(orientation: portrait)").matches;
    }

    function onMobileLayout() {
        return window.innerWidth <= BREAKPOINT && isPortrait();
    }

    function isMobilePage()  {
        return window.location.pathname.includes("book-list-mobile");
    }

    function routePage()  {
        const shouldUseMobile = onMobileLayout();
        const currentlyMobile = isMobilePage();

        if (shouldUseMobile && !currentlyMobile)  {
            window.location.replace(MOBILE_PAGE);
            return;
        }

        if (!shouldUseMobile && currentlyMobile)  {
            window.location.replace(DESKTOP_PAGE);
            return;
        }
    }

    routePage();

    let resizeTimer;
    window.addEventListener("resize", function ()  {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(routePage, 150);
    });

    window.addEventListener("orientationchange", routePage);
})();
</script>

<style>
body {
    margin:0;
    background:#8aa9b3ff;
    color:#e6e3de;
    font-family:Georgia, serif;
}

header {
    padding:16px;
    text-align:center;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

#home-icon {
    position: absolute;
    top: 0;
    right: 1em;
    width: 3em;
    height: 3em;
}

#home-icon img {
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform 0.2s ease;
}

#home-icon img:hover {
    transform: scale(1.1);
}

header h1 {
    margin:1rem;
    font-size:2rem;
}

.wrap {
    max-width:1200px;
    margin:auto;
    padding-bottom:80px;
}

/* =========================
   Year Sign
========================= */

.year-wrap {
    height:135px;
    background:#8aa9b3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-bottom: 15px;
}

.year-sign {
    position:relative;
    transform:
        translateY(var(--y))
        rotate(var(--rot));
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));
}

.year-sign img {
    height: 95px;   /* or whatever your baseline is */
    width: auto;     /* important: prevents distortion */
    display: block;
}

.year-sign span {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform: translateY(15px);
    font-size:2rem;
    font-weight:bold;
    color:#48392cff;
    letter-spacing:.08em;
    text-shadow:0 2px 4px rgba(0,0,0,.55);
}

.year-sign.favorites-sign img {
    width: 300px; /* pick whatever feels right */
}

/* =========================
   Shelf
========================= */

.shelf {
    height:260px;
    background:center/cover no-repeat url('./img/bookshelf.svg');
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:18px;
    padding:0 20px 34px;
}

.book {
    position:relative;
    width:130px;
    bottom:30px;
    text-align:center;
    cursor:pointer;
    outline:none;
}

.book:focus-visible {
    outline:3px solid #f8f5e6;
    outline-offset:5px;
    border-radius:3px;
}

.book::before {
    content:'';
    position:absolute;
    left:10px;
    right:10px;
    top:8px;
    bottom:20px;
    background:rgba(0,0,0,.35);
    filter:blur(8px);
    transform:translate(8px,10px);
    border-radius:6px;
}

.book img {
    position:relative;
    width:relative;
    height:180px;
    object-fit:cover;
    border:1px solid rgba(0,0,0,.35);
    box-shadow:0 0px 20px 5px rgba(0,0,0,.45);
    transition:.25s;
    transform:
        scaleX(var(--sx))
        scaleY(var(--sy));
}

.book:hover img {
    transform:
        translateY(-8px)
        scaleX(var(--sx))
        scaleY(var(--sy))
        scale(1.03);
}

.title-on-book {
    position:absolute;
    top:12px;
    left:10px;
    right:10px;
    z-index:2;
    color:#f8f5e6;
    font-size:.72rem;
    line-height:1.15;
    font-weight:bold;
    text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.65);
}

/* =========================
   Book Details
========================= */

.book-dialog {
    width:min(620px, calc(100vw - 40px));
    padding:0;
    border:1px solid rgba(255,255,255,.2);
    border-radius:14px;
    color:#30271f;
    background:#f4efe5;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
}

.book-dialog::backdrop {
    background:rgba(24,30,31,.78);
    backdrop-filter:blur(5px);
}

.dialog-close {
    position:absolute;
    top:10px;
    right:12px;
    z-index:2;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(48,39,31,.1);
    color:#30271f;
    font:28px/1 Georgia, serif;
    cursor:pointer;
}

.dialog-close:hover,
.dialog-close:focus-visible {
    background:rgba(48,39,31,.2);
    outline:2px solid #745f4c;
}

.dialog-content {
    display:grid;
    grid-template-columns:190px 1fr;
    gap:28px;
    padding:38px;
}

.dialog-cover {
    width:190px;
    height:285px;
    object-fit:cover;
    border-radius:4px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.dialog-details {
    align-self:center;
}

.dialog-details h2 {
    margin:0 28px 24px 0;
    color:#48392c;
    font-size:1.65rem;
    line-height:1.15;
}

.book-meta {
    display:grid;
    grid-template-columns:max-content 1fr;
    gap:10px 16px;
    margin:0;
}

.book-meta dt {
    color:#745f4c;
    font-weight:bold;
}

.book-meta dd {
    margin:0;
}

/* =========================
   Responsive
========================= */

@media (max-width:900px) {
    .shelf {
        gap:12px;
        height:240px;
    }

    .book {
        width:90px;
    }

    .book img {
        width:82px;
        height:128px;
    }
}

@media (max-width:640px) {

    .dialog-content {
        grid-template-columns:1fr;
        justify-items:center;
        gap:22px;
        padding:32px 24px;
    }

    .dialog-cover {
        width:150px;
        height:225px;
    }

    .dialog-details {
        width:100%;
    }

    .dialog-details h2 {
        text-align:center;
    }

    .year-sign img {
        width:190px;
    }

    .year-sign span {
        font-size:1.85rem;
    }

    .shelf {
        gap:8px;
        height:125px;
        flex-wrap:wrap;
        align-content:flex-end;
    }

    .book {
        width:74px;
        bottom:30px;
    }

    .book img {
        width:66px;
        height:104px;
    }

    .title-on-book {
        font-size:.62rem;
        left:6px;
        right:6px;
        top:8px;
    }
}
</style>

        <div class="dialog-details">
            <h2 id="dialog-title"></h2>
            <dl class="book-meta">
                <dt>Genre</dt><dd id="dialog-genre"></dd>
                <dt>Author</dt><dd id="dialog-author"></dd>
                <dt>Page count</dt><dd id="dialog-pages"></dd>
                <dt>Published</dt><dd id="dialog-year"></dd>
                <dt>Date read</dt><dd id="dialog-read"></dd>
            </dl>
        </div>
    </div>
</dialog>

<script>
(function () {
    const dialog = document.getElementById("book-dialog");
    const cover = document.getElementById("dialog-cover");
    const fields = {
        title: document.getElementById("dialog-title"),
        genre: document.getElementById("dialog-genre"),
        author: document.getElementById("dialog-author"),
        pages: document.getElementById("dialog-pages"),
        year: document.getElementById("dialog-year"),
        read: document.getElementById("dialog-read")
    };

    function openBook(book) {
        Object.keys(fields).forEach(function (key) {
            fields[key].textContent = book.dataset[key];
        });
        cover.src = book.dataset.cover;
        cover.alt = "Cover of " + book.dataset.title;
        cover.onerror = function () {
            cover.onerror = null;
            cover.src = book.dataset.fallback;
        };
        dialog.showModal();
    }

    document.querySelectorAll(".book").forEach(function (book) {
        book.addEventListener("click", function () { openBook(book); });
        book.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openBook(book);
            }
        });
    });

    dialog.querySelector(".dialog-close").addEventListener("click", function () {
        dialog.close();
    });

    dialog.addEventListener("click", function (event) {
        if (event.target === dialog) dialog.close();
    });
})();
</script>

</body>
</html>
