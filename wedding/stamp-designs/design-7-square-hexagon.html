<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double Hexagon Monogram — Print Square</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --stamp-blue: #3e6477;
      --stamp-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      overflow: hidden;
      place-items: start center;
      background: var(--stamp-white);
    }

    .print-square {
      position: relative;
      display: grid;
      width: 100vmin;
      height: 100vmin;
      place-items: center;
      overflow: hidden;
      background: var(--stamp-white);
    }

    .hexagon {
      position: absolute;
      inset: 1.82%;
      background: var(--stamp-blue);
      clip-path: polygon(25% 6%, 75% 6%, 98% 50%, 75% 94%, 25% 94%, 2% 50%);
    }

    .hexagon::before,
    .hexagon::after {
      position: absolute;
      content: "";
      clip-path: inherit;
    }

    .hexagon::before {
      inset: 1.4%;
      background: var(--stamp-white);
    }

    .hexagon::after {
      inset: 4.1%;
      background: var(--stamp-blue);
    }

    .hexagon-inner {
      position: absolute;
      inset: 6.2%;
      z-index: 1;
      background: var(--stamp-white);
      clip-path: polygon(25% 6%, 75% 6%, 98% 50%, 75% 94%, 25% 94%, 2% 50%);
    }

    .monogram {
      position: relative;
      z-index: 2;
      color: var(--stamp-blue);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 32.73vmin;
      font-weight: 500;
      letter-spacing: .1em;
      line-height: .88;
      text-align: center;
    }

    .monogram span { display: block; }

    .monogram span + span {
      margin-top: 2.27vmin;
      padding-top: 2.27vmin;
      border-top: .46vmin solid var(--stamp-blue);
    }

    @page {
      size: square;
      margin: 0;
    }

    @media print {
      .print-square {
        width: 100vw;
        height: 100vw;
      }
    }
  </style>
</head>
<body>
  <main class="print-square" aria-label="Quiana and Scott double hexagon monogram stamp">
    <div class="hexagon" aria-hidden="true"></div>
    <div class="hexagon-inner" aria-hidden="true"></div>
    <div class="monogram" aria-hidden="true">
      <span>QS</span>
      <span>SB</span>
    </div>
  </main>
</body>
</html>
