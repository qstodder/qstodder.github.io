<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiana and Scott’s wedding registry funds.">
    <title>Registry | Quiana &amp; Scott</title>
    <link rel="stylesheet" href="css/registry.css?v=3">
    <link rel="stylesheet" href="css/site-shell.css?v=3">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="main-stage">
    <main class="registry-page page-sheet">
        <section class="registry-intro page-intro">
            <h2>Registry</h2>
            <p>Your presence is the greatest gift. If you would like to contribute to our future, we’ve created two funds here.</p>
        </section>

        <section class="fund-grid" aria-label="Wedding funds">
            <article class="fund-card" data-fund="honeymoon" data-fund-name="Honeymoon Fund" data-emoji="🏝️">
                <div class="fund-image-wrap"><img src="assets/registry/honeymoon-fund.png" alt="Mount Fuji framed by cherry blossoms" class="fund-image"></div>
                <div class="fund-content">
                    <p class="fund-number">01</p>
                    <h3>Honeymoon Fund</h3>
                    <div class="payment-options" aria-label="Payment options for the Honeymoon Fund"></div>
                </div>
            </article>

            <article class="fund-card" data-fund="house" data-fund-name="House Fund" data-emoji="🏠">
                <div class="fund-image-wrap"><img src="assets/registry/house-fund.png" alt="Illustrated house surrounded by flowers" class="fund-image"></div>
                <div class="fund-content">
                    <p class="fund-number">02</p>
                    <h3>House Fund</h3>
                    <div class="payment-options" aria-label="Payment options for the House Fund"></div>
                </div>
            </article>

        </section>
    </main>
    </div>

    <dialog id="payment-dialog" class="payment-dialog" aria-labelledby="payment-dialog-title">
        <button class="dialog-close" type="button" aria-label="Close payment information">×</button>
        <div id="payment-dialog-icon" class="dialog-logo" aria-hidden="true"></div>
        <p id="payment-dialog-fund" class="dialog-fund"></p>
        <h2 id="payment-dialog-title"></h2>
        <div id="payment-dialog-copy" class="dialog-copy"></div>
        <div id="payment-dialog-actions" class="dialog-actions"></div>
    </dialog>

    <script src="js/loadHeader.js?v=2"></script>
    <script src="js/carousel.js?v=2"></script>
    <script src="js/navigation.js?v=2"></script>
    <script src="js/registry.js?v=2"></script>
    <script src="js/main.js"></script>
</body>
</html>
